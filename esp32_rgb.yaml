substitutions:
  name: esp32-rgb
  friendly_name: Dandelion

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: esphome.esp32-rgb
    version: "1.0"

esp32:
  board: esp32c3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "esp32-rgb Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

# Enable web server
web_server:
  port: 80
  auth:
    username: !secret web_server_user
    password: !secret web_server_password

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret hass_key

ota:
  platform: esphome
  password: !secret hass_password

light:
  - platform: rgb
    name: ${friendly_name} Light
    red: output_red
    green: output_green
    blue: output_blue
    effects:
      - random:
      - slow_random:
      - fast_random:

output:
  - platform: esp8266_pwm
    id: output_red
    pin: GPIO4
    inverted: true
  - platform: esp8266_pwm
    id: output_green
    pin: GPIO7
    inverted: true
  - platform: esp8266_pwm
    id: output_blue
    pin: GPIO05
    inverted: true
