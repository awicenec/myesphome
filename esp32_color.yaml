esphome:
  name: esp32_color
  platform: ESP32
  board: m5stack-grey

time:
  - platform: sntp
    id: sntp_time

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: on
  reboot_timeout: 0s
  power_save_mode: high
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${name} Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

# Enable web server
web_server:
  port: 80
  auth:
    username: !secret web_server_user
    password: !secret web_server_password

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret hass_key

ota:
  platform: esphome
  password: !secret hass_password
i2c:
  scan: True
  id: bus_a
  sda: GPIO22
  scl: GPIO21

sensor:
  - platform: tcs34725
    red_channel:
      name: "Red Channel"
    green_channel:
      name: "Green Channel"
    blue_channel:
      name: "Blue Channel"
    clear_channel:
      name: "Clear Channel"
    illuminance:
      name: "Illuminance"
    color_temperature:
      name: "Color Temperature"
    glass_attenuation_factor: 1.0
    address: 0x29
    update_interval: 0.5s

